    <style>
    .txt{
      transform: translate(-15px, -60px);
      z-index: 999;
      font-size: 1.4rem;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 700;
      pointer-events: none;
      color: #e64c78;
      width: 20rem;
      opacity: 0;
      transition: 0.2s;
    }
#killCounterDisplay {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 2rem;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 700;
      color: #FFD700; /* Gold color */
      z-index: 1000;
      text-shadow: 2px 2px 0px #000000; /* Black stroke */
    }
    #ammoDisplay {
      position: absolute;
      top: 60px; /* Below the timer */
      left: 20px;
      font-size: 1.5rem; /* Slightly smaller than timer */
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 700;
      color: #4CAF50; /* Green for ammo, could be different */
      z-index: 1000;
      text-shadow: 1px 1px 0px #000000; /* Black stroke */
    }
    .txt.show {
    opacity: 1;
    transform: translate(-15px, -80px); 
    }

    body {
      margin: 0;
      background: #2A363B;
      overflow: hidden;
    }

    .container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }
    @keyframes screenShake {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(2px, 2px); }
      50% { transform: translate(-2px, -2px); }
      75% { transform: translate(2px, -2px); }
    }
    .screen-shake {
      animation: screenShake 0.1s linear;
    }
    /* The Player */
    .player {
      position: absolute;
      top: 200px;
      left: 200px;
      transform: translateX(-50%) translateY(-50%);
      width: 45px;
      height: 55px;
      background: white;
      border-radius: 10px;
      z-index: 5;
      /* Reload Progress Bar Container */
      /* The Hat */
      /* Eyes */
      /* The Mouth */
      /* The Shirt (and tie) */
      /* The Arms */
      /* Legs */
      /* Shadow */
    }
    .player .hat {
      position: absolute;
      top: 15%;
      transform: translateY(-100%);
      width: 100%;
      height: 34%;
      background: #D32C1B;
      border-top-right-radius: 10px;
      border-top-left-radius: 10px;
    }
    .player .hat::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 100%;
      width: 35%;
      height: 2px;
      background: #D32C1B;
      transform: translateY(-100%);
    }
    .player .eye {
      position: absolute;
      width: 5px;
      height: 5px;
      background: black;
      top: 25%;
    }
    .player .eye.right {
      right: 10%;
    }
    .player .eye.left {
      right: 50%;
    }
    .player .mouth {
      position: absolute;
      top: 40%;
      width: 20%;
      height: 2px;
      background: black;
      left: 65%;
    }
    .player .shirt {
      position: absolute;
      bottom: -1px;
      width: 105%;
      height: 50%;
      left: 50%;
      transform: translateX(-50%);
      background: #CF2213;
      border-radius: 10px;
      border-top-right-radius: 0px;
      border-top-left-radius: 0px;
      overflow: hidden;
      /* The Undershirt */
    }
    .player .shirt .tie {
      background: #E31B15;
      width: 10%;
      height: 70%;
      position: absolute;
      top: 0;
      left: 55%;
      border-bottom-right-radius: 5px;
      border-bottom-left-radius: 55px;
    }
    .player .shirt .under {
      position: absolute;
      left: 60%;
      top: 0px;
      width: 40%;
      height: 99%;
      transform: translateX(-50%);
      background: #FFF5F4;
    }
    .player .arm {
      position: absolute;
      width: 25%;
      height: 40%;
      background: white;
      border-radius: 10px;
      top: 60%;
      transform-origin: 50% 5%;
    }
    .player .arm.right {
      right: -10%;
      transform: rotate(-1.5rad);
      z-index: 0;
    }
    .player .arm.right .gun {
      position: absolute;
      top: 80%;
      left: 100%;
      width: 100%;
      height: 150%;
      background: black;
      transform-origin: -100% 0%;
    }
    .player .arm.right .gun::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 250%;
      height: 40%;
      background: black;
    }
    .player .arm.right .gun .barrel {
      position: absolute;
      top: 100%;
      left: 50%;
      width: 1px;
      height: 1px;
      transform: translateX(-50%) translateY(-50%);
    }
    .player .arm.left {
      left: -5%;
    }
    .player .arm .sleeve {
      position: absolute;
      top: 0;
      left: 0;
      border-radius: 10px;
      background: #E31B15;
      width: 100%;
      height: 50%;
      border-bottom-right-radius: 0px;
      border-bottom-left-radius: 0px;
    }
    .player .leg {
      position: absolute;
      top: 80%;
      width: 25%;
      height: 45%;
      background: white;
      border-radius: 10px;
      z-index: -1;
      transform-origin: 50% 5%;
      transform: translateX(-50%);
    }
    .player .leg.right {
      right: -5%;
    }
    .player .leg.left {
      left: 20%;
    }
    .player .leg .pant {
      position: absolute;
      width: 100%;
      height: 80%;
      top: 0;
      left: 0;
      background: #4093BD;
    }
    .player::after {
      content: "";
      position: absolute;
      top: 115%;
      left: 50%;
      transform: translateX(-50%);
      background: RGBA(0, 0, 0, 0.2);
      z-index: -2;
      width: 100%;
      height: 10px;
      border-radius: 50%;
    }
    .reload-progress-bar-container {
      position: absolute;
      bottom: 110%; /* Positioned above the player */
      left: 50%;
      transform: translateX(-50%);
      width: 40px; /* Match player-ish width */
      height: 5px;
      background-color: rgba(0, 0, 0, 0.2);
      border-radius: 3px;
      overflow: hidden;
      display: none; /* Hidden by default */
      z-index: 6; /* Above player, below bullets/UI */
    }
    .reload-progress-bar {
      width: 0%; /* Starts empty */
      height: 100%;
      background-color: #FFC107; /* Amber color, same as reloading text */
      border-radius: 3px;
      transition: width 0.1s linear; /* Smooth fill, adjust timing if needed */
    }
    /* Bullets */
    .bullet {
      position: absolute;
      width: 25px;
      height: 15px;
      background: yellow;
      transform: translateX(-50%) translateY(-50%);
      z-index: 10;
    }

    /* Bullet Flash */
    .flash {
      position: absolute;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: white;
      transform: translateX(-50%) translateY(-50%);
    }

    /* Smoke Clouds */
    .cloud {
      position: absolute;
      background: Silver;
      border-radius: 50%;
      transform: translateX(-50%) translateY(-50%);
    }

    /* Enemies */
    .enemy {
      position: absolute;
      transform: translateX(-50%) translateY(-50%);
      /* Good ol' Jimmy */
      transition: opacity 0.8s ease-out; /* Extended transition for fade-out */
    }
    .enemy.poop.fading-out {
      opacity: 0;
    }
    .enemy.poop {
      width: 40px;
      height: 50px;
      background-image: url('poop-enemy.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      position: relative; /* Needed for absolute positioning of die-text */
    }
    .enemy.poop .die-text {
      color: #29B6F6; /* Soap-blue, fits the "Cleansed" theme */
    }
.enemy .die-text { /* Common styles for all die-text */
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-weight: bold;
      font-size: 1.2em;
      font-family: Arial, sans-serif;
      display: none; 
      pointer-events: none;
      text-shadow: 1px 1px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff;
      opacity: 0; /* Start invisible for animation */
    }
.enemy .die-text.animate-cry {
      display: block !important; 
      animation-name: cryAnimation;
      animation-duration: 0.7s;
      animation-fill-mode: forwards;
      animation-timing-function: ease-out;
    }
    /* Hit Particles */
    .particle {
      position: absolute;
      width: 6px; /* particleBaseSize */
      height: 6px; /* particleBaseSize */
      background-color: #FFD700; /* Gold */
      border-radius: 50%;
      pointer-events: none;
      z-index: 100; /* Above most other game elements */
      opacity: 1;
      transform: scale(1);
      /* particleAnimationDuration is 300ms, defined in JS */
      transition: left 0.3s cubic-bezier(0.17, 0.67, 0.83, 0.67), 
                  top 0.3s cubic-bezier(0.17, 0.67, 0.83, 0.67), 
                  opacity 0.3s ease-out, 
                  transform 0.3s ease-out;
    }
@keyframes cryAnimation {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.5);
      }
      20% { /* Quickly appear and grow */
        opacity: 1;
        transform: translate(-50%, calc(-50% - 10px)) scale(1.2);
      }
      70% { /* Hold, slight movement */
        opacity: 1;
        transform: translate(-50%, calc(-50% - 15px)) scale(1.15) rotate(-3deg);
      }
      100% { /* Fade out and move up further */
        opacity: 0;
        transform: translate(-50%, calc(-50% - 30px)) scale(0.8) rotate(5deg);
      }
    }
    #gameOverMessage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 48px;
      color: white;
      background-color: rgba(0,0,0,0.8);

      z-index: 1000;
      display: none;
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
      border: 3px solid #e64c78;
    }
    #gameOverMessage small {
      display: block;
      font-size: 24px;
      margin-top: 10px;
    }

    /* ===== Next-game placeholder screen ===== */
    #nextGamePlaceholder {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 2000;
      display: none;
    }
    #nextGamePlaceholder p {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      margin: 0;
      color: #fff;
      font-size: 2.5rem;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 700;
      text-align: center;
    }

    /* ===== Sad Bunnies: Hug Game ===== */
    .bunny-game-viewport {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #8fd3e8;
    }
    .bunny-game-world {
      position: absolute;
      top: 0;
      left: 0;
    }
    .bunny-game-player {
      position: absolute;
      width: 31px;
      height: 39px;
      background-image: url('orange-cat.png');
      background-size: contain;
      background-repeat: no-repeat;
      z-index: 5;
    }
    .bunny-game-player.hugging {
      transition: left 0.25s ease-out, top 0.25s ease-out;
    }
    .bunny-game-bunny {
      position: absolute;
      width: 30px;
      height: 46px;
      background-size: contain;
      background-repeat: no-repeat;
      transform: translate(-50%, -50%);
      z-index: 4;
    }
    .bunny-game-bunny.hugging {
      transition: left 0.25s ease-out, top 0.25s ease-out;
    }
    .bunny-hug-heart {
      position: absolute;
      font-size: 14px;
      pointer-events: none;
      z-index: 7;
      animation: bunnyHeartFloat 0.9s ease-out forwards;
    }
    @keyframes bunnyHeartFloat {
      0% { transform: translate(-50%, -50%) scale(0.6); opacity: 1; }
      100% { transform: translate(-50%, -160%) scale(1.2); opacity: 0; }
    }
    .bunny-game-tree {
      position: absolute;
      width: 43px;
      height: 60px;
      background-image: url('tree.png');
      background-size: contain;
      background-repeat: no-repeat;
      transform: translate(-50%, -100%);
      z-index: 3;
      pointer-events: none;
    }
    .bunny-game-counter {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 700;
      text-shadow: 2px 2px 0px #000000;
      text-align: right;
    }
    .bunny-game-counter-main {
      font-size: 1.5rem;
    }
    .bunny-game-counter-sub {
      font-size: 0.75rem;
      margin-top: 2px;
    }
    .bunny-hug-progress-container {
      position: absolute;
      width: 30px;
      height: 5px;
      background-color: rgba(0, 0, 0, 0.2);
      border-radius: 3px;
      overflow: hidden;
      display: none;
      transform: translate(-50%, -170%);
      z-index: 6;
    }
    .bunny-hug-progress-bar {
      width: 0%;
      height: 100%;
      background-color: #4CAF50;
      transition: width 0.1s linear;
    }
    .bunny-game-end-message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 40px;
      color: white;
      background-color: rgba(0,0,0,0.8);
      padding: 30px;
      border-radius: 10px;
      z-index: 20;
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
      border: 3px solid #e64c78;
    }
    .bunny-game-end-message small {
      display: block;
      font-size: 22px;
      margin-top: 10px;
    }
